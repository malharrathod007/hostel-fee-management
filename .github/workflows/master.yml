name: Laravel CI/CD Pipeline

on:
  push:
    branches: [ "master" ]

env:
  PHP_VERSION: "8.2"
  DEPLOY_PATH: /var/www/8c9b1c5a-6533-4986-80f0-4149ec8ce405/public_html/Hostel

jobs:
  build:
    name: Build Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: public/build/
          retention-days: 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: public/build/

      - name: Transfer Build Artifacts to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "public/build/"
          target: "${{ env.DEPLOY_PATH }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          username: ${{ secrets.SSH_USER }}
          host: ${{ secrets.SERVER_IP }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            DEPLOY_PATH="/var/www/8c9b1c5a-6533-4986-80f0-4149ec8ce405/public_html/Hostel"
            cd "$DEPLOY_PATH"
            echo "Starting Deployment at $DEPLOY_PATH"

            # 1. Update Source (public/build is gitignored, won't be touched)
            git fetch origin master
            git reset --hard origin/master

            # 2. Maintenance Mode
            php artisan down --retry=60 || true

            # 3. Install PHP Dependencies
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # 4. Database & Optimization
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 5. File System
            php artisan storage:link || true
            chmod -R 775 storage bootstrap/cache

            # 6. Finalize
            php artisan up

            echo "Deployment Successful!"
