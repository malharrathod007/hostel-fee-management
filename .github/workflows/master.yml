name: Laravel CI/CD Pipeline

on:
  push:
    branches: [ "master" ]

env:
  PHP_VERSION: "8.2"
  DEPLOY_PATH: /var/www/8c9b1c5a-6533-4986-80f0-4149ec8ce405/public_html/Hostel
  PROJECT_ROOT: .

jobs:
  build:
    name: Build Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install NPM dependencies
        run: npm ci
        working-directory: ${{ env.PROJECT_ROOT }}

      - name: Build Assets
        run: npm run build
        working-directory: ${{ env.PROJECT_ROOT }}    

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: public/build/
          retention-days: 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: public/build/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          username: ${{ secrets.SSH_USER }}
          host: ${{ secrets.SERVER_IP }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /var/www/8c9b1c5a-6533-4986-80f0-4149ec8ce405/public_html/Hostel
            echo "Starting Deployment to ${DEPLOY_PATH}"
            
            cd ${DEPLOY_PATH}

            # 1. Update Source
            git fetch origin master
            git reset --hard origin/master
            
            # 2. Maintenance Mode
            php artisan down --retry=60 || true

            # 3. Install PHP Dependencies
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # 4. Build assets on server
            npm ci
            npm run build

            # 5. Database & Optimization
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # 6. File System
            php artisan storage:link || true
            chmod -R 775 storage bootstrap/cache

            # 8. Finalize
            php artisan up
            
            echo "Deployment Successful!"
